input:
  prompt: "A dragon flying over Dublin at golden hour, cinematic slow motion"

num_scenes: 3

pipeline:
  - storyboard
  - image
  - video
  - voice
  - render

providers:
  llm:
    provider: anthropic

  image:
    provider: comfyui
    host: "127.0.0.1"
    port: 8188
    workflow: "examples/workflows/flux_t2i.json"
    prompt_node_id: "2"

  video:
    provider: comfyui
    host: "127.0.0.1"
    port: 8188
    workflow: "examples/workflows/wan_i2v.json"
    prompt_node_id: "2"
    image_node_id: "3"

  audio:
    provider: elevenlabs
    # api_key: ...  # or set ELEVENLABS_API_KEY env var
    voice_id: "21m00Tcm4TlvDq8ikWAM"

output: "output.mp4"
workspace: "workspace"
